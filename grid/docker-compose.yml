services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grid}
      POSTGRES_USER: ${POSTGRES_USER:-grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grid}
    ports:
      - "5433:5432"
    volumes:
      - grid_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grid} -d ${POSTGRES_DB:-grid}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://grid:grid@db:5432/grid?sslmode=disable}
      API_PORT: ${API_PORT:-8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-grid_session}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/auth/google/callback}
    ports:
      - "8080:8080"
    volumes:
      - grid_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      target: dev
    environment:
      VITE_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  grid_pgdata:
  grid_uploads:
