app = "gridlink-staging"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[env]
  APP_ENV = "staging"
  APP_DEBUG = "false"
  APP_URL = "https://gridlink-staging.fly.dev"
  LOG_CHANNEL = "stderr"
  SESSION_SECURE_COOKIE = "true"

[deploy]
  release_command = "php artisan migrate --force"

[[mounts]]
  source = "gridlink_staging_storage"
  destination = "/var/www/html/storage"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
